      - path: .env.production
        pattern: '(?m)^MINIO_ENDPOINT=http://tolink-minio:9000$'
        message: Production MinIO 必须使用 Cloud 容器 DNS

  - id: environment-layering
    description: 本地 worktree、FastAPI、Dev Compose 与 Production Compose 都支持基础配置加私密覆盖
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'configured_secret = os\.environ\.get\("LINKCV_SECRET_ENV_FILE"\)[\s\S]*_default_secret_env_file\(base\)'
        message: Settings 必须支持显式私密文件并回退 worktree 共享覆盖
      - path: package.json
        pattern: '"dev:development": "node scripts/dev/run_with_env_profile\.mjs \.env\.development"'
        message: 本地 Development 启动必须经过共享私密配置加载器
      - path: .ai/prompts/project.md
        pattern: '`npm run dev` 只是 `dev:local` 的兼容别名[\s\S]*`APP_ENV` 控制应用功能，不负责选择 env 文件'
        message: 项目入口必须要求显式选择本地或共享 Dev profile，不能用 APP_ENV 推断配置文件
      - path: .ai/skills/incident-triage/SKILL.md
        pattern: '启动器实际打印的“基础配置”和“共享私密覆盖”路径[\s\S]*`APP_ENV` 只控制应用功能，不选择 env profile'
        message: 故障分诊必须核实真实 env 文件路径，不能用 APP_ENV 推断配置文件
      - path: scripts/dev/run_with_env_profile.mjs
        pattern: 'resolveMainWorktreeRoot[\s\S]*LINKCV_SECRET_ENV_FILE[\s\S]*dev:services'
        message: 本地启动器必须从 Git 主工作目录加载私密覆盖并启动全部服务
      - path: deploy/docker-compose.production.yml
        pattern: 'LINKCV_ENV_FILE:-\.\./\.env\.production'
        message: Production Compose 必须默认加载基础配置
      - path: deploy/docker-compose.production.yml
        pattern: 'LINKCV_SECRET_ENV_FILE:-\.\./\.env\.production\.local'
        message: Production Compose 必须后加载私密覆盖
      - path: deploy/docker-compose.development.yml
        pattern: 'LINKCV_ENV_FILE:-\.\./\.env\.development'
        message: Dev Compose 必须默认加载基础配置
      - path: deploy/docker-compose.development.yml
        pattern: 'LINKCV_SECRET_ENV_FILE:-\.\./\.env\.development\.local'
        message: Dev Compose 必须后加载私密覆盖

  - id: node-lockfile-tarball-host
    description: 容器构建保留 Node 锁文件中的 tarball 主机，避免镜像源缺失制品时强制改写下载地址
    assertions:
      - path: Dockerfile
        pattern: 'npm ci --no-audit --replace-registry-host=never --registry="\$\{NPM_REGISTRY\}"'
        message: npm ci 必须保留 package-lock.json 已锁定的 tarball 主机

  - id: resume-pdf-chromium-runtime
    description: FastAPI、三套环境与生产镜像使用同一个受控 Chromium 路径和智能一页高度上限
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'default="/usr/bin/chromium",[\s\S]*alias="CHROMIUM_EXECUTABLE_PATH"[\s\S]*default=2000,[\s\S]*alias="PDF_RENDERER_MAX_SMART_HEIGHT_MM"'
        message: FastAPI 必须读取受控 Chromium 路径和智能一页高度上限
      - path: .env.example
        pattern: '(?m)^CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium$[\s\S]*^PDF_RENDERER_MAX_SMART_HEIGHT_MM=2000$'
        message: 本地环境模板必须声明 PDF Chromium 运行契约
      - path: .env.development
        pattern: '(?m)^CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium$[\s\S]*^PDF_RENDERER_MAX_SMART_HEIGHT_MM=2000$'
        message: Development 必须声明 PDF Chromium 运行契约
      - path: .env.production
        pattern: '(?m)^CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium$[\s\S]*^PDF_RENDERER_MAX_SMART_HEIGHT_MM=2000$'
        message: Production 必须声明 PDF Chromium 运行契约
      - path: Dockerfile
        pattern: 'CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium[\s\S]*PDF_RENDERER_MAX_SMART_HEIGHT_MM=2000[\s\S]*apt-get install -y --no-install-recommends chromium[\s\S]*node_modules/playwright-core /app/pdf/node_modules/playwright-core'
        message: 生产镜像必须提供与 FastAPI 配置一致的 Chromium、页面上限和 Playwright 运行库

  - id: pi-model-data-offline-build
    description: Pi 模型目录使用版本化快照，常规安装和镜像构建不访问实时外部目录
    assertions:
      - path: deploy/Dockerfile.pi
        pattern: 'RUN --network=none[\s\S]*npm run check:model-data &&[\s\S]*npm run build:offline'
        message: 独立 Pi 镜像必须在禁用网络的构建层中校验模型快照并完成离线构建
      - path: package.json
        pattern: '"prepare:pi": "npm --prefix third_party/pi run check:model-data"'
        message: 常规环境同步不得联网刷新 Pi 模型目录
      - path: package.json
        pattern: '"refresh:pi-model-data": "npm --prefix third_party/pi run hydrate:model-data"'
        message: Pi 模型快照必须使用显式维护命令刷新
      - path: third_party/pi/packages/ai/src/providers/data/.manifest.json
        pattern: '"schemaVersion"\s*:\s*3'
        message: 仓库必须包含 Pi 模型快照 manifest

  - id: sql-first-alembic-migrations
    description: 后续迁移通过独立 SQL 文件执行，容器启动前校验并执行迁移
    assertions:
      - path: apps/backend/migrations/script.py.mako
        pattern: 'execute_sql_file\(op\.get_bind\(\), SQL_DIR / "\$\{up_revision\}\.up\.sql"\)'
        message: 新 revision 必须通过独立 up SQL 文件执行
      - path: apps/backend/migrations/script.py.mako
        pattern: 'LinkCV database migrations are forward-only'
        message: 新 revision 必须明确拒绝 downgrade
      - path: scripts/db/create_sql_revision.py
        pattern: 'create_up_sql_file\(revision\.revision, args\.message\)'
        message: 生成 revision 时只创建 up SQL 文件
      - path: Dockerfile
        pattern: 'run_alembic\.py.*&& exec uvicorn'
        message: 容器必须先通过迁移 runner 再启动 FastAPI
      - path: .ai/skills/alembic-migration/SKILL.md
        pattern: '只生成同 ID 的 `\.up\.sql`'
        message: 迁移 Skill 必须要求 forward-only up SQL
      - path: .ai/skills/alembic-migration/SKILL.md
        pattern: '禁止使用 `alembic revision --autogenerate`'
        message: 迁移 Skill 不得把 autogenerate 作为 SQL-first 入口
      - path: .ai/prompts/project.md
        pattern: '根 revision `0001`'
        message: 项目入口必须反映已经建立的 MySQL 根 revision
      - path: Dockerfile
        pattern: 'python -m pip install --index-url "\$\{UV_INDEX_URL\}" "uv==\$\{UV_VERSION\}"'
        message: uv 必须通过可配置的 PyPI 镜像安装，不能依赖 GHCR 镜像
      - path: Dockerfile
        pattern: 'uv pip install .*--index-url "\$\{UV_INDEX_URL\}" --requirements /tmp/requirements\.txt'
        message: 锁定的 Python 依赖必须从可配置镜像下载，不能复用 uv.lock 中的外部制品 URL

  - id: deployment-environment-isolation
    description: Dev 与 Production 使用独立的发布目标和运行资源
    assertions:
      - path: deploy/docker-compose.development.yml
        pattern: '(?m)^    container_name: linkcv-dev$'
        message: Dev 必须使用独立容器名
      - path: deploy/docker-compose.development.yml
        pattern: 'LINKCV_DEV_HTTP_PORT:-18002'
        message: Dev 必须使用独立宿主机端口 18002
      - path: deploy/docker-compose.development.yml
        pattern: 'LINKCV_DOCKER_NETWORK:-tolink-dev-net'
        message: Dev 必须加入隔离开发网络
      - path: deploy/scripts/build-development-on-primary.sh
        pattern: 'dev_root="/opt/tolink/dev"'
        message: Dev 必须部署到 /opt/tolink/dev
      - path: deploy/scripts/build-development-on-primary.sh
        pattern: 'tag="dev-\$\{commit_short\}-b\$\{build_number\}"'
        message: Dev 镜像必须使用 dev-<commit>-b<build> 标签
      - path: deploy/jenkins/Jenkinsfile.development
        pattern: 'PRIMARY_SSH_KEY = ''/var/jenkins_home/\.ssh/primary_dev'''
        message: Dev Jenkins 必须使用 primary_dev 密钥
      - path: deploy/jenkins/Jenkinsfile.development
        pattern: 'tokenCredentialId: ''linkcv-dev-webhook-token'''
        message: Dev webhook token 必须来自 Jenkins Secret Text 凭据
      - path: deploy/jenkins/Jenkinsfile.development
        pattern: 'regexpFilterExpression: ''\^refs/heads/dev\$'''
        message: Dev webhook 必须只接受 refs/heads/dev push
      - path: deploy/docker-compose.production.yml
        pattern: '(?m)^    container_name: linkcv$'
        message: Production 必须使用生产容器名
      - path: deploy/docker-compose.production.yml
        pattern: 'LINKCV_HTTP_PORT:-4174'
        message: Production 必须保持反向代理使用的宿主机端口 4174
      - path: deploy/docker-compose.production.yml
        pattern: 'LINKCV_DOCKER_NETWORK:-tolink-app-net'
        message: Production 必须加入生产应用网络
      - path: Jenkinsfile
        pattern: 'CLOUD_HOST = ''100\.77\.31\.79'''
        message: Production Jenkins 必须把发布交给 Cloud 生产主机
      - path: Jenkinsfile
        pattern: 'CLOUD_SSH_KEY = ''/var/jenkins_home/\.ssh/cloud_prod'''
        message: Production Jenkins 必须使用独立 Cloud SSH 密钥
      - path: deploy/scripts/build-production-on-cloud.sh
        pattern: 'prod_root="/opt/tolink/LinkCV"'
        message: Production 远端脚本必须使用 Cloud 生产部署目录
      - path: deploy/scripts/build-production-on-cloud.sh
        pattern: 'tag="prod-\$\{commit_short\}-b\$\{build_number\}"'
        message: Production 镜像必须使用 prod-<commit>-b<build> 标签
      - path: deploy/scripts/build-production-on-cloud.sh
        pattern: 'http_port="4174"'
        message: Production 远端健康检查必须使用宿主机端口 4174
      - path: deploy/scripts/build-production-on-cloud.sh
        pattern: 'required_secret_keys=\([\s\S]*PI_SERVICE_TOKEN[\s\S]*pi_health_status=.*linkcv-pi'
        message: Production 必须在发布前要求 Pi 内部令牌并检查 Pi Service 健康状态
      - path: deploy/scripts/build-production-on-cloud.sh
        pattern: 'backup_compose_file="\$\{backup_dir\}/docker-compose\.production\.yml"[\s\S]*docker compose -f "\$\{backup_compose_file\}" up -d --remove-orphans'
        message: Production 回滚必须使用发布前备份的 Compose，兼容首次引入 Pi Service
      - path: Jenkinsfile
        pattern: 'tokenCredentialId: ''linkcv-dev-webhook-token'''
        message: Production webhook token 必须来自现有 Jenkins Secret Text 凭据
      - path: Jenkinsfile
        pattern: 'regexpFilterExpression: ''\^refs/heads/master\$'''
        message: Production webhook 必须只接受 refs/heads/master push

  - id: jenkins-migration-targets
    description: 两条 Jenkins 发布链在部署前校验各自的环境与数据库目标
    assertions:
      - path: deploy/scripts/build-development-on-primary.sh
        pattern: '--expected-app-env development[\s\S]*--expected-host 100\.86\.10\.52[\s\S]*--expected-port 13306[\s\S]*--expected-database linkcv'
        message: Dev 迁移必须锁定共享 Dev 的独立 linkcv 数据库
      - path: deploy/scripts/build-production-on-cloud.sh
        pattern: '--expected-app-env production[\s\S]*--expected-host tolink-mysql[\s\S]*--expected-port 3306[\s\S]*--expected-database linkcv'
        message: Production 远端迁移必须锁定 Cloud 的独立 linkcv 数据库
      - path: deploy/scripts/build-production-on-cloud.sh
        pattern: 'python /app/scripts/db/init_mysql\.py[\s\S]*python /app/scripts/release/run_alembic\.py'
        message: Production 必须先初始化独立数据库再执行 Alembic
      - path: Jenkinsfile
        pattern: 'defaultValue: false,[\s\S]*description: ''仅首次切换时导入旧 Production SQLite'
        message: 旧 SQLite 导入必须是默认关闭的一次性人工参数

  - id: development-resource-isolation
    description: Dev 使用专属 Redis DB 和对象存储 Bucket
    assertions:
      - path: .env.development
        pattern: '(?m)^REDIS_DB=2$'
        message: LinkCV Dev 必须使用独立 Redis DB 2
      - path: .env.development
        pattern: '(?m)^MINIO_BUCKET=linkcv$'
        message: LinkCV Dev 必须使用独立 linkcv Bucket
