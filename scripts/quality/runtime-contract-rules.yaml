version: 1

contracts:
  - id: development-local-agent-startup
    description: Development 本地脚本向四个进程加载同一配置并使用回环服务地址
    assertions:
      - path: package.json
        pattern: '"dev:development": "node scripts/dev/run_with_env_profile\.mjs \.env\.development"[\s\S]*"dev:development-services": "bash scripts/dev/start-development\.sh"'
        message: 根级 Development 启动入口必须先加载共享配置，再进入 Agent 感知的统一脚本
      - path: scripts/dev/run_with_env_profile.mjs
        pattern: 'serviceScriptForProfile[\s\S]*\.env\.development[\s\S]*dev:development-services'
        message: Development profile 必须路由到 Agent 感知的四服务启动器
      - path: scripts/dev/start-development.sh
        pattern: 'BACKEND_PORT="\$\{backend_port\}"[\s\S]*PI_SERVICE_BASE_URL="http://127\.0\.0\.1:\$\{pi_port\}"[\s\S]*LINKCV_BASE_URL="http://127\.0\.0\.1:\$\{backend_port\}"[\s\S]*--env-file=\$\{base_env\}'
        message: 启动脚本必须加载 Development 配置并统一本地跨服务地址
      - path: scripts/dev/run-development.mjs
        pattern: 'RABBITMQ_URL[\s\S]*LINKCV_LOCAL_RABBITMQ_HOST[\s\S]*MYSQL_HOST[\s\S]*LINKCV_LOCAL_RABBITMQ_PORT'
        message: 本机 Worker 必须把 Development 容器 DNS 转换为可达的 AMQP 地址
      - path: scripts/dev/run-development.mjs
        pattern: 'npm:dev:web[\s\S]*npm:dev:backend[\s\S]*npm:dev:worker[\s\S]*npm:dev:pi'
        message: 启动器必须同时启动 Web、FastAPI、Worker 与 Pi

  - id: agent-readiness-deployment-contract
    description: Dev 与 Production 通过 FastAPI 检查完整 Agent 服务链后才完成部署
    assertions:
      - path: apps/backend/src/linkcv/modules/agent/routes.py
        pattern: '@router\.get\("/readiness", response_model=AgentReadinessResponse\)'
        message: FastAPI 必须暴露不泄露配置的 Agent readiness 入口
      - path: apps/pi-service/src/server.js
        pattern: 'GET" && url\.pathname === "/internal/agent/readiness"'
        message: Pi 必须提供受服务令牌保护的内部 readiness
      - path: deploy/scripts/build-production-on-cloud.sh
        pattern: 'pi_image="linkcv-pi"[\s\S]*PI_TAG="\$\{tag\}"[\s\S]*/api/agent/readiness'
        message: Production 远端发布必须部署同版本 Pi 镜像并检查完整 Agent 服务链
      - path: deploy/scripts/build-development-on-primary.sh
        pattern: '/api/agent/readiness'
        message: Dev 发布必须检查完整 Agent 服务链

  - id: pi-provider-network-contract
    description: Pi SDK 服务继承部署环境代理并把供应商失败作为运行失败上报
    assertions:
      - path: third_party/pi/packages/coding-agent/src/index.ts
        pattern: 'export \{ configureHttpDispatcher \} from "\./core/http-dispatcher\.ts"'
        message: Pi SDK 公共入口必须暴露 HTTP 代理初始化能力
      - path: apps/pi-service/src/server.js
        pattern: 'configureHttpDispatcher\(\);[\s\S]*const config = loadConfig\(\);'
        message: Pi 服务必须在处理模型请求前启用环境代理
      - path: apps/pi-service/src/runtime/agent.js
        pattern: 'message\.stopReason === "error"[\s\S]*AGENT_MODEL_REQUEST_FAILED[\s\S]*assertAgentCompleted\(finalAssistantMessage\)'
        message: Pi 服务不得把模型供应商错误误报为运行成功

  - id: observability-loki-promtail-contract
    description: LinkCV 三套环境固定七天 JSONL 契约，Dev/Production 使用独立 Promtail 和共享 Loki
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'default="linkcv", alias="LOG_SERVICE_NAME"[\s\S]*default=7, alias="LOG_RETENTION_DAYS"[\s\S]*default=5,[\s\S]*alias="LOKI_QUERY_TIMEOUT_SECONDS"'
        message: 后端必须固定 LinkCV service、七天本地保留和五秒 Loki 查询预算
      - path: .env.example
        pattern: '(?m)^LOG_SERVICE_NAME=linkcv$[\s\S]*^LOG_RETENTION_DAYS=7$[\s\S]*^LOKI_QUERY_TIMEOUT_SECONDS=5$'
        message: 本地模板必须声明统一日志契约
      - path: .env.development
        pattern: '(?m)^LOG_DIRECTORY=/app/logs$[\s\S]*^LOG_RETENTION_DAYS=7$[\s\S]*^LOKI_QUERY_URL=http://tolink-dev-loki:3100$[\s\S]*^LOKI_PUSH_URL=http://tolink-dev-loki:3100/loki/api/v1/push$'
        message: Dev 必须使用独立日志目录和共享 Dev Loki 内网地址
      - path: .env.production
        pattern: '(?m)^LOG_DIRECTORY=/app/logs$[\s\S]*^LOG_RETENTION_DAYS=7$[\s\S]*^LOKI_QUERY_URL=http://tolink-loki:3100$[\s\S]*^LOKI_PUSH_URL=http://tolink-loki:3100/loki/api/v1/push$'
        message: Production 必须使用独立日志目录和共享 Production Loki 内网地址
      - path: deploy/docker-compose.development.yml
        pattern: 'grafana/promtail:2\.9\.8[\s\S]*container_name: linkcv-dev-promtail[\s\S]*linkcv-dev-logs:/var/log/linkcv:ro[\s\S]*linkcv-dev-promtail-positions:/tmp'
        message: Dev 必须部署固定版本的独立 Promtail、日志卷和 positions 卷
      - path: deploy/docker-compose.production.yml
        pattern: 'grafana/promtail:2\.9\.8[\s\S]*container_name: linkcv-promtail[\s\S]*linkcv-production-logs:/var/log/linkcv:ro[\s\S]*linkcv-production-promtail-positions:/tmp'
        message: Production 必须部署固定版本的独立 Promtail、日志卷和 positions 卷
      - path: deploy/docker-compose.observability.local.yml
        pattern: 'grafana/promtail:2\.9\.8[\s\S]*container_name: linkcv-local-promtail[\s\S]*LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push[\s\S]*LINKCV_LOG_PATH:-\.\./\.runtime/logs[\s\S]*LOKI_DOCKER_NETWORK:-tolink-rag-local_tolink-net'
        message: 本地联调必须使用独立 Promtail、LinkCV 日志目录和 LinkRag 共享 Loki 网络
      - path: deploy/observability/promtail-config.yml
        pattern: '__path__: /var/log/linkcv/\*\*/linkcv\*\.jsonl[\s\S]*service: service[\s\S]*environment: environment[\s\S]*log_type: log_type[\s\S]*level: level[\s\S]*labels:[\s\S]*service:[\s\S]*environment:[\s\S]*log_type:[\s\S]*level:'
        message: Promtail 只能提升约定的低基数 JSON 字段为 Loki labels
      - path: apps/backend/src/linkcv/workers/__main__.py
        pattern: 'configure_logging\(settings\)'
        message: 异步导入 Worker 必须启用与 FastAPI 相同的结构化日志入口
      - path: deploy/docker-compose.development.yml
        pattern: 'linkcv-worker:[\s\S]*LOG_DIRECTORY: /app/logs/worker[\s\S]*linkcv-dev-logs:/app/logs'
        message: Dev Worker 必须使用共享卷中的独立日志子目录
      - path: deploy/docker-compose.production.yml
        pattern: 'linkcv-worker:[\s\S]*LOG_DIRECTORY: /app/logs/worker[\s\S]*linkcv-production-logs:/app/logs'
        message: Production Worker 必须使用共享卷中的独立日志子目录

  - id: llm-credential-encryption-key-ring
    description: 三套环境都声明后端模型凭据密钥环且不把真实密钥提交到仓库
    assertions:
      - path: .env.example
        pattern: '(?m)^LLM_CREDENTIAL_ENCRYPTION_KEYS=$'
        message: 本地模板必须声明空的 LLM 凭据密钥环
      - path: .env.development
        pattern: '(?m)^LLM_CREDENTIAL_ENCRYPTION_KEYS=$'
        message: Dev 基础配置必须由私密覆盖提供 LLM 凭据密钥环
      - path: .env.production
        pattern: '(?m)^LLM_CREDENTIAL_ENCRYPTION_KEYS=$'
        message: Production 基础配置必须由私密覆盖提供 LLM 凭据密钥环

  - id: unified-llm-timeout
    description: 统一 LLM Gateway 与三套环境使用同一个请求超时默认值
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'default=75,[\s\S]*alias="LLM_TIMEOUT_SECONDS"'
        message: FastAPI 必须保留统一 LLM 超时默认值 75 秒
      - path: .env.example
        pattern: '(?m)^LLM_TIMEOUT_SECONDS=75$'
        message: 本地模板必须声明统一 LLM 超时
      - path: .env.development
        pattern: '(?m)^LLM_TIMEOUT_SECONDS=75$'
        message: Dev 配置必须声明统一 LLM 超时
      - path: .env.production
        pattern: '(?m)^LLM_TIMEOUT_SECONDS=75$'
        message: Production 配置必须声明统一 LLM 超时

  - id: fastapi-default-port
    description: FastAPI 和 Vite 使用同一个 BACKEND_PORT 默认值
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'default=8000, alias="BACKEND_PORT"'
        message: FastAPI 配置必须默认监听 8000
      - path: apps/web/vite.config.mjs
        pattern: 'process\.env\.BACKEND_PORT \?\? "8000"'
        message: Vite 必须用 BACKEND_PORT=8000 构造默认后端目标

  - id: fastapi-api-ownership
    description: 所有 /api 请求由 FastAPI 承接
    assertions:
      - path: apps/web/vite.config.mjs
        pattern: '"/api"\s*:\s*\{\s*target:\s*backendTarget'
        message: Vite 必须把 /api 代理到 backendTarget
      - path: apps/backend/src/linkcv/main.py
        pattern: 'include_router\(api_router, prefix="/api"\)'
        message: FastAPI 聚合路由必须使用 /api 前缀
      - path: apps/backend/src/linkcv/api/routes/health.py
        pattern: '@router\.get\("/health"'
        message: FastAPI 必须注册 /health 子路由
      - path: .ai/prompts/project.md
        pattern: '开发期全部 `/api` 请求由 Vite 代理到 FastAPI'
        message: 项目入口不得继续声明只有 health 归 FastAPI
      - path: .ai/skills/incident-triage/SKILL.md
        pattern: '当前全部 `/api` 由 FastAPI 承接'
        message: 故障分诊必须使用当前 FastAPI 路由归属

  - id: jwt-cookie-contract
    description: 三套环境显式声明一致的双 Token Cookie 名称和默认有效期
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'default=15, alias="ACCESS_TTL_MINUTES"[\s\S]*default="resume_access", alias="ACCESS_COOKIE_NAME"[\s\S]*default="resume_refresh", alias="REFRESH_COOKIE_NAME"[\s\S]*default=7, alias="SESSION_TTL_DAYS"'
        message: FastAPI 必须保留双 Token Cookie 名称和有效期默认值
      - path: .env.example
        pattern: '(?m)^SESSION_TTL_DAYS=7$[\s\S]*^ACCESS_TTL_MINUTES=15$[\s\S]*^ACCESS_COOKIE_NAME=resume_access$[\s\S]*^REFRESH_COOKIE_NAME=resume_refresh$'
        message: 本地模板必须声明双 Token Cookie 契约
      - path: .env.development
        pattern: '(?m)^SESSION_TTL_DAYS=7$[\s\S]*^ACCESS_TTL_MINUTES=15$[\s\S]*^ACCESS_COOKIE_NAME=resume_access$[\s\S]*^REFRESH_COOKIE_NAME=resume_refresh$'
        message: Dev 配置必须声明双 Token Cookie 契约
      - path: .env.production
        pattern: '(?m)^SESSION_TTL_DAYS=7$[\s\S]*^ACCESS_TTL_MINUTES=15$[\s\S]*^ACCESS_COOKIE_NAME=resume_access$[\s\S]*^REFRESH_COOKIE_NAME=resume_refresh$'
        message: Production 配置必须声明双 Token Cookie 契约

  - id: wechat-miniprogram-environment-contract
    description: Production 普通登录使用微信，且小程序本地联调必须显式 opt-in
    assertions:
      - path: .env.development
        pattern: '(?m)^APP_ENV=development$'
        message: Development 必须允许后端能力接口开放普通账号密码登录
      - path: .env.example
        pattern: '(?m)^APP_ENV=local$'
        message: 本地模板必须使用允许普通账号密码登录的 local 环境
      - path: apps/backend/src/linkcv/modules/identity/routes.py
        pattern: 'app_environment\.strip\(\)\.lower\(\) in \{"local", "development"\}'
        message: 本地和 Development 必须共享密码登录能力，Production 必须排除在外
      - path: .env.production
        pattern: '(?m)^APP_ENV=production$'
        message: Production 必须关闭普通账号密码登录
      - path: .env.example
        pattern: '(?m)^WECHAT_APPID=$[\s\S]*^WECHAT_SECRET=$[\s\S]*^WECHAT_API_TIMEOUT_SECONDS=5$'
        message: 环境模板必须声明后端实际读取的微信凭据与超时键
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'invalid\.append\("WECHAT_APPID"\)[\s\S]*invalid\.append\("WECHAT_SECRET"\)'
        message: Production 必须在启动时拒绝缺少微信凭据的配置
      - path: deploy/scripts/build-development-on-primary.sh
        pattern: 'required_secret_keys=\([\s\S]*WECHAT_APPID[\s\S]*WECHAT_SECRET[\s\S]*Missing required Development secret setting[\s\S]*Settings\(\)\.wechat_enabled[\s\S]*docker network inspect'
        message: Dev 发布必须在迁移与容器替换前拒绝缺失、空值或占位的微信凭据
      - path: apps/miniprogram/config/runtime.js
        pattern: 'productionApiBaseUrl: "https://linkresume\.cn"'
        message: 小程序必须保留 linkresume.cn 作为生产默认 API 地址
      - path: apps/miniprogram/config/env.js
        pattern: 'developmentStorageKey: "linkcv_api_base_url"[\s\S]*envVersion === "develop"[\s\S]*readStorageValue\(developmentStorageKey\)[\s\S]*!isDevelop[\s\S]*startsWith\("https://"\)'
        message: API 内网地址覆盖只能用于开发版，体验版和正式版必须强制 HTTPS
      - path: apps/miniprogram/config/env.js
        pattern: 'LOCAL_DEBUG_ENABLED_STORAGE_KEY = "linkcv_local_debug_enabled"[\s\S]*const localDebugEnabled = isDevelop[\s\S]*readStorageValue\(LOCAL_DEBUG_ENABLED_STORAGE_KEY\) === true[\s\S]*const localConfig = localDebugEnabled[\s\S]*readLocalConfigSafely\(localConfigReader\)[\s\S]*: null'
        message: 包内 local.js 只能在 develop 且显式开启 linkcv_local_debug_enabled 后读取
      - path: apps/miniprogram/config/env.js
        pattern: 'function readAccountInfoSafely\(\)[\s\S]*typeof wx\.getAccountInfoSync !== "function"[\s\S]*return null[\s\S]*try[\s\S]*const account = wx\.getAccountInfoSync\(\)[\s\S]*typeof account\.miniProgram\.envVersion !== "string"[\s\S]*return null[\s\S]*catch \{[\s\S]*return null'
        message: 小程序环境识别缺失、字段不完整或异常时必须安全失败
      - path: apps/miniprogram/config/env.js
        pattern: 'const account = readAccountInfoSafely\(\);[\s\S]*const envVersion = account \? account\.miniProgram\.envVersion : null;[\s\S]*const isDevelop = envVersion === "develop";'
        message: 只有明确 envVersion 为 develop 才允许读取开发配置与 storage 覆盖
      - path: apps/miniprogram/config/env.js
        pattern: 'const developmentOverride = typeof developmentOverrideValue === "string"[\s\S]*const configured = \([\s\S]*developmentOverride[\s\S]*\|\| localOverride[\s\S]*\|\| extBaseUrl[\s\S]*\|\| productionDefault'
        message: develop 的显式 linkcv_api_base_url 必须优先于 local.js，其他环境只能回退生产地址
      - path: apps/miniprogram/services/resumes.js
        pattern: 'downloadResumePreview[\s\S]*version_id=[\s\S]*/api/miniprogram/resumes/[\s\S]*/preview\.png'
        message: 小程序必须通过后端专用只读接口查询并下载正式版本 PNG 预览

  - id: environment-profile-database-isolation
    description: 三套环境都使用独立 linkcv 数据库
    assertions:
      - path: .env.example
        pattern: '(?m)^MYSQL_DATABASE=linkcv$'
        message: 本地模板必须使用 linkcv 数据库
      - path: .env.development
        pattern: '(?m)^MYSQL_DATABASE=linkcv$'
        message: Dev 配置不得写入 LinkRag 数据库
      - path: .env.production
        pattern: '(?m)^MYSQL_DATABASE=linkcv$'
        message: Production 配置必须使用独立 linkcv 数据库

  - id: interview-asset-upload-limit
    description: FastAPI 与三套环境使用一致的面试素材上传上限
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'default=500 \* 1024 \* 1024,[\s\S]*alias="INTERVIEW_ASSET_UPLOAD_MAX_BYTES"'
        message: FastAPI 必须使用 500 MiB 的面试素材上传上限
      - path: .env.example
        pattern: '(?m)^INTERVIEW_ASSET_UPLOAD_MAX_BYTES=524288000$'
        message: 本地环境模板必须声明面试素材上传上限
      - path: .env.development
        pattern: '(?m)^INTERVIEW_ASSET_UPLOAD_MAX_BYTES=524288000$'
        message: Development 必须声明面试素材上传上限
      - path: .env.production
        pattern: '(?m)^INTERVIEW_ASSET_UPLOAD_MAX_BYTES=524288000$'
        message: Production 必须声明面试素材上传上限

  - id: dataset-upload-admission-contract
    description: FastAPI 与三套环境使用一致的资料上传、配额和解析恢复默认值
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'default=10 \* 1024 \* 1024,[\s\S]*alias="DATASET_UPLOAD_MAX_BYTES"[\s\S]*default=10,[\s\S]*alias="DATASET_MAX_FILES_PER_BATCH"[\s\S]*default=20,[\s\S]*alias="DATASET_UPLOAD_REQUESTS_PER_MINUTE"[\s\S]*default=3,[\s\S]*alias="DATASET_UPLOAD_USER_CONCURRENCY"[\s\S]*default=12,[\s\S]*alias="DATASET_UPLOAD_GLOBAL_CONCURRENCY"[\s\S]*default=200,[\s\S]*alias="DATASET_MAX_COUNT_PER_USER"[\s\S]*default=1024 \* 1024 \* 1024,[\s\S]*alias="DATASET_MAX_TOTAL_BYTES_PER_USER"[\s\S]*default=5,[\s\S]*alias="DATASET_DISPATCH_SCAN_SECONDS"[\s\S]*default=30,[\s\S]*alias="DATASET_REDISPATCH_AFTER_SECONDS"[\s\S]*default=240,[\s\S]*alias="DATASET_PARSE_STALE_SECONDS"[\s\S]*default=3,[\s\S]*alias="DATASET_PARSE_MAX_ATTEMPTS"[\s\S]*default=86400,[\s\S]*alias="DATASET_UPLOAD_RESERVATION_TTL_SECONDS"'
        message: FastAPI 必须使用方案确认的资料上传、配额和解析恢复默认值
      - path: .env.example
        pattern: '(?m)^DATASET_UPLOAD_MAX_BYTES=10485760$[\s\S]*^DATASET_MAX_FILES_PER_BATCH=10$[\s\S]*^DATASET_UPLOAD_REQUESTS_PER_MINUTE=20$[\s\S]*^DATASET_UPLOAD_USER_CONCURRENCY=3$[\s\S]*^DATASET_UPLOAD_GLOBAL_CONCURRENCY=12$[\s\S]*^DATASET_MAX_COUNT_PER_USER=200$[\s\S]*^DATASET_MAX_TOTAL_BYTES_PER_USER=1073741824$[\s\S]*^DATASET_DISPATCH_SCAN_SECONDS=5$[\s\S]*^DATASET_REDISPATCH_AFTER_SECONDS=30$[\s\S]*^DATASET_PARSE_STALE_SECONDS=240$[\s\S]*^DATASET_PARSE_MAX_ATTEMPTS=3$[\s\S]*^DATASET_UPLOAD_RESERVATION_TTL_SECONDS=86400$'
        message: 本地模板必须声明资料上传、配额和解析恢复默认值
      - path: .env.development
        pattern: '(?m)^DATASET_UPLOAD_MAX_BYTES=10485760$[\s\S]*^DATASET_MAX_FILES_PER_BATCH=10$[\s\S]*^DATASET_UPLOAD_REQUESTS_PER_MINUTE=20$[\s\S]*^DATASET_UPLOAD_USER_CONCURRENCY=3$[\s\S]*^DATASET_UPLOAD_GLOBAL_CONCURRENCY=12$[\s\S]*^DATASET_MAX_COUNT_PER_USER=200$[\s\S]*^DATASET_MAX_TOTAL_BYTES_PER_USER=1073741824$[\s\S]*^DATASET_DISPATCH_SCAN_SECONDS=5$[\s\S]*^DATASET_REDISPATCH_AFTER_SECONDS=30$[\s\S]*^DATASET_PARSE_STALE_SECONDS=240$[\s\S]*^DATASET_PARSE_MAX_ATTEMPTS=3$[\s\S]*^DATASET_UPLOAD_RESERVATION_TTL_SECONDS=86400$'
        message: Development 必须声明资料上传、配额和解析恢复默认值
      - path: .env.production
        pattern: '(?m)^DATASET_UPLOAD_MAX_BYTES=10485760$[\s\S]*^DATASET_MAX_FILES_PER_BATCH=10$[\s\S]*^DATASET_UPLOAD_REQUESTS_PER_MINUTE=20$[\s\S]*^DATASET_UPLOAD_USER_CONCURRENCY=3$[\s\S]*^DATASET_UPLOAD_GLOBAL_CONCURRENCY=12$[\s\S]*^DATASET_MAX_COUNT_PER_USER=200$[\s\S]*^DATASET_MAX_TOTAL_BYTES_PER_USER=1073741824$[\s\S]*^DATASET_DISPATCH_SCAN_SECONDS=5$[\s\S]*^DATASET_REDISPATCH_AFTER_SECONDS=30$[\s\S]*^DATASET_PARSE_STALE_SECONDS=240$[\s\S]*^DATASET_PARSE_MAX_ATTEMPTS=3$[\s\S]*^DATASET_UPLOAD_RESERVATION_TTL_SECONDS=86400$'
        message: Production 必须声明资料上传、配额和解析恢复默认值

  - id: redis-local-port
    description: 本地配置与 Compose 使用同一个 Redis 默认端口
    assertions:
      - path: .env.example
        pattern: '(?m)^REDIS_PORT=6379$'
        message: 本地模板必须声明 Redis 6379
      - path: deploy/docker-compose.yml
        pattern: '\$\{REDIS_PORT:-6379\}:6379'
        message: Compose 必须使用 REDIS_PORT=6379 作为默认映射

  - id: resume-import-admission-defaults
    description: FastAPI 与三套环境使用一致的简历导入成本保护默认值
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
