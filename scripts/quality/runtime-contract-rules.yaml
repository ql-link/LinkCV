        message: Dev 环境必须声明完整异步导入超时与幂等默认值
      - path: .env.production
        pattern: '(?m)^RESUME_STRUCTURING_TIMEOUT_SECONDS=60$[\s\S]*^RESUME_IMPORT_PARSE_DEADLINE_SECONDS=180$[\s\S]*^RESUME_IMPORT_PARSE_STALE_SECONDS=240$[\s\S]*^RESUME_IMPORT_IDEMPOTENCY_BIND_TTL_SECONDS=30$[\s\S]*^RESUME_IMPORT_IDEMPOTENCY_TTL_SECONDS=900$'
        message: Production 环境必须声明完整异步导入超时与幂等默认值

  - id: async-resume-import-broker-contract
    description: FastAPI、Worker、环境模板与 Compose 使用同一套异步导入 Broker 契约
    assertions:
      - path: apps/backend/src/linkcv/core/config.py
        pattern: 'default="rabbitmq", alias="MQ_VENDOR"[\s\S]*default="tolink\.cv\.resume_import"[\s\S]*alias="RABBITMQ_EXCHANGE_NAME"[\s\S]*default="resume\.import"[\s\S]*alias="RABBITMQ_ROUTING_KEY"'
        message: 后端必须默认使用 RabbitMQ 固定 exchange 和 routing key
      - path: .env.example
        pattern: '(?m)^MQ_VENDOR=rabbitmq$[\s\S]*^RABBITMQ_URL=amqp://linkcv:linkcv-rabbit-local-change-me@127\.0\.0\.1:5672/$[\s\S]*^RABBITMQ_ROUTING_KEY=resume\.import$'
        message: 本地模板必须连接本地 RabbitMQ 并声明固定路由
      - path: .env.development
        pattern: '(?m)^MQ_VENDOR=rabbitmq$[\s\S]*^RABBITMQ_URL=$[\s\S]*^RABBITMQ_ROUTING_KEY=resume\.import$'
        message: Dev 必须由私密覆盖提供平台 RabbitMQ 地址
      - path: .env.production
        pattern: '(?m)^MQ_VENDOR=rabbitmq$[\s\S]*^RABBITMQ_URL=$[\s\S]*^RABBITMQ_ROUTING_KEY=resume\.import$'
        message: Production 必须由私密覆盖提供平台 RabbitMQ 地址
      - path: deploy/docker-compose.yml
        pattern: '(?m)^  rabbitmq:$[\s\S]*rabbitmq:4-management-alpine'
        message: 本地 Compose 必须提供 RabbitMQ
      - path: deploy/docker-compose.development.yml
        pattern: '(?m)^  linkcv-worker:$[\s\S]*command: \["python", "-m", "linkcv\.workers"\]'
        message: Dev Compose 必须启动独立导入 Worker
      - path: deploy/docker-compose.production.yml
        pattern: '(?m)^  linkcv-worker:$[\s\S]*command: \["python", "-m", "linkcv\.workers"\]'
        message: Production Compose 必须启动独立导入 Worker

  - id: production-middleware-docker-dns
    description: Production 通过 tolink-app-net 的 Docker DNS 连接已迁移中间件
    assertions:
