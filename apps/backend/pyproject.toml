[project]
name = "linkcv-backend"
version = "0.1.0"
description = "LinkCV FastAPI backend"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.15,<2.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "markdown-it-py>=4.0,<5.0",
  "minio>=7.2,<8.0",
  "pydantic[email]>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pyjwt>=2.10,<3.0",
  "pymysql>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "redis[hiredis]>=5.2,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "pyyaml>=6.0,<7.0",
  "pytest>=8.3,<9.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkcv"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
