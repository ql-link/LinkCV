name: Quality

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: npm ci --prefix apps/web
      - run: uv sync --directory apps/backend --dev
      - run: npm run check
