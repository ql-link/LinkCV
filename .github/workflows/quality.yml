name: Quality

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

permissions:
  contents: read

# 同一 PR 连续推送时只保留最新一次运行；共享分支 push 不取消，保证每次合并都有完整结果
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.detect.outputs.migrations }}
      revisions: ${{ steps.detect.outputs.revisions }}
      extension: ${{ steps.scope.outputs.extension }}
      desktop: ${{ steps.scope.outputs.desktop }}
      miniprogram: ${{ steps.scope.outputs.miniprogram }}
      pi: ${{ steps.scope.outputs.pi }}
      devenv: ${{ steps.scope.outputs.devenv }}
      contracts: ${{ steps.scope.outputs.contracts }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "revisions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          # 共享分支 push 总是兜底跑一次完整迁移
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -Eq '^(apps/backend/migrations/|apps/backend/tests/integration/migrations/|apps/backend/src/linkresume/core/migration_sql\.py$|apps/backend/src/linkresume/.*/models\.py$|apps/backend/alembic\.ini$|apps/backend/uv\.lock$|\.github/workflows/quality\.yml$)'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi
          # 本次新增 revision 的编号，用于挑选同名 MySQL 迁移测试
          revisions="$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- 'apps/backend/migrations/versions/*.py' \
            | sed -nE 's#.*/([0-9]{4})_[^/]*\.py$#\1#p' | sort -u | tr '\n' ' ')"
          echo "revisions=$revisions" >> "$GITHUB_OUTPUT"

      # 按改动路径决定需要运行的应用检查；共享分支 push、无法确定基线或改动了根配置/质量脚本/本工作流时全部运行
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            all=true
            changed=""
          else
            changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
            if printf '%s\n' "$changed" | grep -Eq '^(package\.json|package-lock\.json|\.github/workflows/quality\.yml|scripts/quality/)'; then
              all=true
            fi
          fi
          # has <扩展正则>：本次改动是否命中，或已要求全部运行
          has() { [ "$all" = "true" ] || printf '%s\n' "$changed" | grep -Eq "$1"; }
          emit() { if has "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          emit extension '^apps/extension/'
          emit desktop '^apps/desktop/'
          emit miniprogram '^apps/miniprogram/'
          emit pi '^(apps/pi-service/|third_party/pi/)'
          emit devenv '^scripts/dev/'
          # 契约检查横跨 Web、后端、部署与环境变量
          emit contracts '^(apps/web/|apps/backend/|deploy/|scripts/|\.env)'

  migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: linkresume
          MYSQL_USER: linkresume
          MYSQL_PASSWORD: linkresume-test
          MYSQL_ROOT_PASSWORD: linkresume-root-test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ulinkresume -plinkresume-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --directory apps/backend --dev
      - name: Verify MySQL upgrade from empty database to head
        working-directory: apps/backend
        env:
          APP_ENV: development
          DATABASE_URL: mysql+pymysql://linkresume:linkresume-test@127.0.0.1:3306/linkresume
          LINKRESUME_ENV_FILE: ${{ github.workspace }}/.env.nonexistent-migration-test
        run: |
          uv run alembic upgrade head
          # 重跑验证幂等
          uv run alembic upgrade head
          uv run alembic current
      - name: Verify MySQL tests for new revisions
        if: needs.changes.outputs.revisions != ''
        env:
          LINKRESUME_TEST_MYSQL_URL: mysql+pymysql://linkresume:linkresume-test@127.0.0.1:3306/linkresume
          REVISIONS: ${{ needs.changes.outputs.revisions }}
        run: |
          selector=""
          for revision in $REVISIONS; do
            selector="${selector:+$selector or }$revision"
          done
          echo "pytest -k: $selector"
          status=0
          uv run --directory apps/backend pytest tests/integration/migrations/test_mysql_migrations.py -k "$selector" -q || status=$?
          # 5 表示新增 revision 没有同名 MySQL 测试，此时只依赖上一步的升级校验
          if [ "$status" -eq 5 ]; then
            echo "::notice::No MySQL migration tests matched revisions: $REVISIONS"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Verify account lifecycle and job pool concurrency on MySQL
        env:
          APP_ENV: development
          LINKRESUME_ENV_FILE: ${{ github.workspace }}/.env.nonexistent-migration-test
          # The suite creates and drops its own randomly named schema.
          LINKRESUME_TEST_MYSQL_URL: mysql+pymysql://root:linkresume-root-test@127.0.0.1:3306/linkresume
        run: uv run --directory apps/backend pytest tests/integration/migrations/test_account_completion_mysql.py tests/integration/migrations/test_job_pool_mysql.py -q

  # 规则与文档同步检查只依赖 git 和 Python，不等待 Node 依赖安装，失败时约半分钟内给出结果。
  # check:contracts 需要 Web 依赖加载 vite.config.mjs，仍由 check job 的 npm run check 覆盖。
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --directory apps/backend --dev
      - name: Check AI links and project skills
        run: |
          uv run --directory apps/backend python ../../scripts/quality/check_ai_links.py
          uv run --directory apps/backend python ../../scripts/quality/check_skills.py
      - name: Check docs sync
        run: uv run --directory apps/backend python ../../scripts/quality/check_docs_sync.py
        env:
          DOCS_SYNC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # 以下应用检查彼此独立，按改动路径并行运行；未命中的 job 会被跳过。
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      # check:contracts 需要 Web 依赖加载 vite.config.mjs
      - run: npm ci --prefix apps/web
      - run: uv sync --directory apps/backend --dev
      - run: npm run check:contracts

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci --prefix apps/extension
      - run: npm run typecheck:extension
      - run: npm run test:extension
      - run: npm run build:extension

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --prefix apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck:desktop
      - run: npm run test:desktop

  miniprogram:
    needs: changes
    if: needs.changes.outputs.miniprogram == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run test:miniprogram

  pi:
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/pi-service/package-lock.json
            third_party/pi/package-lock.json
      - run: npm ci --prefix apps/pi-service
      - run: npm ci --prefix third_party/pi
      - run: npm run check:pi

  devenv:
    needs: changes
    if: needs.changes.outputs.devenv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run test:dev-env

  # 汇总 job：保持原有的 "Quality / check" 状态名，分支保护无需修改。
  # 被跳过的 job 视为通过；任一 job 失败或被取消则整体失败。
  check:
    needs: [changes, migrations, rules, contracts, extension, desktop, miniprogram, pi, devenv]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "有检查失败或被取消"; exit 1 ;;
          esac
