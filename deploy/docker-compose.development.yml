services:
  linkcv:
    image: linkcv:${TAG:?TAG is required}
    container_name: linkcv-dev
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.development}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.development.local}
    environment:
      APP_ENV: development
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      WEB_DIST_DIR: /app/web
      TZ: Asia/Shanghai
    ports:
      - "${LINKCV_DEV_HTTP_PORT:-18002}:8000"
    volumes:
      - linkcv-dev-logs:/app/logs
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: development
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  promtail:
    image: grafana/promtail:2.9.8
    container_name: linkcv-dev-promtail
    restart: always
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.development}
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - linkcv-dev-logs:/var/log/linkcv:ro
      - linkcv-dev-promtail-positions:/tmp
    networks:
      - linkcv-runtime
    depends_on:
      linkcv:
        condition: service_started

networks:
  linkcv-runtime:
    external: true
    name: ${LINKCV_DOCKER_NETWORK:-tolink-dev-net}

volumes:
  linkcv-dev-logs:
    name: linkcv-dev-logs
  linkcv-dev-promtail-positions:
    name: linkcv-dev-promtail-positions
