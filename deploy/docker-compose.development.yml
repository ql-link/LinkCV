services:
  linkcv:
    image: linkcv:${TAG:?TAG is required}
    container_name: linkcv-dev
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.development}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.development.local}
    environment:
      APP_ENV: development
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      PI_SERVICE_URL: http://linkcv-pi:8010
      WEB_DIST_DIR: /app/web
      TZ: Asia/Shanghai
    ports:
      - "${LINKCV_DEV_HTTP_PORT:-18002}:8000"
    volumes:
      - linkcv-dev-logs:/app/logs
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: development
    depends_on:
      linkcv-pi:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  linkcv-pi:
    image: linkcv:${TAG:?TAG is required}
    container_name: linkcv-pi-dev
    command: ["node", "/app/pi/server.js"]
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.development}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.development.local}
    environment:
      PI_SERVICE_HOST: 0.0.0.0
      PI_SERVICE_PORT: 8010
      TZ: Asia/Shanghai
    expose:
      - "8010"
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: development
      com.linkcv.role: pi-service
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  promtail:
    image: grafana/promtail:2.9.8
    container_name: linkcv-dev-promtail
    restart: always
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.development}
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - linkcv-dev-logs:/var/log/linkcv:ro
      - linkcv-dev-promtail-positions:/tmp
    networks:
      - linkcv-runtime
    depends_on:
      linkcv:
        condition: service_started
      linkcv-worker:
        condition: service_started

  linkcv-worker:
    image: linkcv:${TAG:?TAG is required}
    container_name: linkcv-worker-dev
    command: ["python", "-m", "linkcv.workers"]
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.development}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.development.local}
    environment:
      APP_ENV: development
      LOG_DIRECTORY: /app/logs/worker
      TZ: Asia/Shanghai
    volumes:
      - linkcv-dev-logs:/app/logs
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: development
      com.linkcv.role: resume-import-worker

networks:
  linkcv-runtime:
    external: true
    name: ${LINKCV_DOCKER_NETWORK:-tolink-dev-net}

volumes:
  linkcv-dev-logs:
    name: linkcv-dev-logs
  linkcv-dev-promtail-positions:
    name: linkcv-dev-promtail-positions
