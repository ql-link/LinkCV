services:
  linkcv:
    image: linkcv:${TAG:?TAG is required}
    container_name: linkcv-dev
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.development}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.development.local}
    environment:
      APP_ENV: development
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      WEB_DIST_DIR: /app/web
      TZ: Asia/Shanghai
    ports:
      - "${LINKCV_DEV_HTTP_PORT:-18002}:8000"
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: development
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  linkcv-worker:
    image: linkcv:${TAG:?TAG is required}
    container_name: linkcv-worker-dev
    command: ["python", "-m", "linkcv.workers"]
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.development}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.development.local}
    environment:
      APP_ENV: development
      TZ: Asia/Shanghai
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: development
      com.linkcv.role: resume-import-worker

networks:
  linkcv-runtime:
    external: true
    name: ${LINKCV_DOCKER_NETWORK:-tolink-dev-net}
