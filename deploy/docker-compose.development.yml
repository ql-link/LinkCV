services:
  linkresume-pi:
    image: linkresume-pi:${PI_TAG:?PI_TAG is required}
    container_name: linkresume-pi-dev
    restart: always
    env_file:
      - ${LINKRESUME_ENV_FILE:-../.env.development}
      - ${LINKRESUME_SECRET_ENV_FILE:-../.env.development.local}
    environment:
      APP_ENV: development
      LINKRESUME_BASE_URL: http://linkresume:8000
      PI_SERVICE_HOST: 0.0.0.0
      PI_SERVICE_PORT: 8010
      TZ: Asia/Shanghai
    networks:
      - linkresume-runtime
    labels:
      com.linkresume.environment: development
      com.linkresume.role: pi-agent
    depends_on:
      linkresume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  linkresume:
    image: linkresume:${TAG:?TAG is required}
    container_name: linkresume-dev
    restart: always
    env_file:
      - ${LINKRESUME_ENV_FILE:-../.env.development}
      - ${LINKRESUME_SECRET_ENV_FILE:-../.env.development.local}
    environment:
      APP_ENV: development
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      WEB_DIST_DIR: /app/web
      TZ: Asia/Shanghai
    ports:
      - "${LINKRESUME_DEV_HTTP_PORT:-18002}:8000"
    volumes:
      - linkresume-dev-logs:/app/logs
    networks:
      - linkresume-runtime
    labels:
      com.linkresume.environment: development
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  promtail:
    image: grafana/promtail:2.9.8
    container_name: linkresume-dev-promtail
    restart: always
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    env_file:
      - ${LINKRESUME_ENV_FILE:-../.env.development}
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - linkresume-dev-logs:/var/log/linkresume:ro
      - linkresume-dev-promtail-positions:/tmp
    networks:
      - linkresume-runtime
    depends_on:
      linkresume:
        condition: service_started
      linkresume-worker:
        condition: service_started

  linkresume-worker:
    image: linkresume:${TAG:?TAG is required}
    container_name: linkresume-worker-dev
    command: ["python", "-m", "linkresume.workers"]
    restart: always
    env_file:
      - ${LINKRESUME_ENV_FILE:-../.env.development}
      - ${LINKRESUME_SECRET_ENV_FILE:-../.env.development.local}
    environment:
      APP_ENV: development
      LOG_DIRECTORY: /app/logs/worker
      TZ: Asia/Shanghai
    volumes:
      - linkresume-dev-logs:/app/logs
    networks:
      - linkresume-runtime
    labels:
      com.linkresume.environment: development
      com.linkresume.role: resume-import-worker

networks:
  linkresume-runtime:
    external: true
    name: ${LINKRESUME_DOCKER_NETWORK:-tolink-dev-net}

volumes:
  linkresume-dev-logs:
    name: linkresume-dev-logs
  linkresume-dev-promtail-positions:
    name: linkresume-dev-promtail-positions
