services:
  drawoffer-pi:
    image: drawoffer-pi:${PI_TAG:?PI_TAG is required}
    container_name: drawoffer-pi
    restart: always
    env_file:
      - ${DRAWOFFER_ENV_FILE:-${LINKRESUME_ENV_FILE:-../.env.production}}
      - ${DRAWOFFER_SECRET_ENV_FILE:-${LINKRESUME_SECRET_ENV_FILE:-../.env.production.local}}
    environment:
      APP_ENV: production
      DRAWOFFER_BASE_URL: http://drawoffer:8000
      PI_SERVICE_HOST: 0.0.0.0
      PI_SERVICE_PORT: 8010
      TZ: Asia/Shanghai
    networks:
      drawoffer-runtime:
        aliases:
          - linkresume-pi
    labels:
      com.linkresume.environment: production
      com.linkresume.role: pi-agent
    depends_on:
      drawoffer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  drawoffer:
    image: drawoffer:${TAG:-latest}
    container_name: drawoffer
    restart: always
    env_file:
      - ${DRAWOFFER_ENV_FILE:-${LINKRESUME_ENV_FILE:-../.env.production}}
      - ${DRAWOFFER_SECRET_ENV_FILE:-${LINKRESUME_SECRET_ENV_FILE:-../.env.production.local}}
    environment:
      APP_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      WEB_DIST_DIR: /app/web
      TZ: Asia/Shanghai
    ports:
      - "${DRAWOFFER_HTTP_PORT:-${LINKRESUME_HTTP_PORT:-4174}}:8000"
    volumes:
      - linkresume-production-logs:/app/logs
    networks:
      drawoffer-runtime:
        aliases:
          - linkresume
    labels:
      com.linkresume.environment: production
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  promtail:
    image: grafana/promtail:2.9.8
    container_name: drawoffer-promtail
    restart: always
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    env_file:
      - ${DRAWOFFER_ENV_FILE:-${LINKRESUME_ENV_FILE:-../.env.production}}
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - linkresume-production-logs:/var/log/linkresume:ro
      - linkresume-production-promtail-positions:/tmp
    networks:
      - drawoffer-runtime
    depends_on:
      drawoffer:
        condition: service_started
      drawoffer-worker:
        condition: service_started

  drawoffer-worker:
    image: drawoffer:${TAG:-latest}
    container_name: drawoffer-worker
    command: ["python", "-m", "drawoffer.workers"]
    restart: always
    env_file:
      - ${DRAWOFFER_ENV_FILE:-${LINKRESUME_ENV_FILE:-../.env.production}}
      - ${DRAWOFFER_SECRET_ENV_FILE:-${LINKRESUME_SECRET_ENV_FILE:-../.env.production.local}}
    environment:
      APP_ENV: production
      LOG_DIRECTORY: /app/logs/worker
      TZ: Asia/Shanghai
    volumes:
      - linkresume-production-logs:/app/logs
    networks:
      - drawoffer-runtime
    labels:
      com.linkresume.environment: production
      com.linkresume.role: resume-import-worker

networks:
  drawoffer-runtime:
    external: true
    name: ${DRAWOFFER_DOCKER_NETWORK:-${LINKRESUME_DOCKER_NETWORK:-tolink-app-net}}

volumes:
  linkresume-production-logs:
    name: linkresume-production-logs
  linkresume-production-promtail-positions:
    name: linkresume-production-promtail-positions
