services:
  linkcv:
    image: linkcv:${TAG:-latest}
    container_name: linkcv
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.production}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.production.local}
    environment:
      APP_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      WEB_DIST_DIR: /app/web
      TZ: Asia/Shanghai
    ports:
      - "${LINKCV_HTTP_PORT:-8000}:8000"
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: production
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  linkcv-worker:
    image: linkcv:${TAG:-latest}
    container_name: linkcv-worker
    command: ["python", "-m", "linkcv.workers"]
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.production}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.production.local}
    environment:
      APP_ENV: production
      TZ: Asia/Shanghai
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: production
      com.linkcv.role: resume-import-worker

networks:
  linkcv-runtime:
    external: true
    name: ${LINKCV_DOCKER_NETWORK:-tolink-app-net}
