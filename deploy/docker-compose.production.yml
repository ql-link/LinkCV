services:
  linkcv:
    image: linkcv:${TAG:-latest}
    container_name: linkcv
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.production}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.production.local}
    environment:
      APP_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      WEB_DIST_DIR: /app/web
      TZ: Asia/Shanghai
    ports:
      - "${LINKCV_HTTP_PORT:-8000}:8000"
    volumes:
      - linkcv-production-logs:/app/logs
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: production
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  promtail:
    image: grafana/promtail:2.9.8
    container_name: linkcv-promtail
    restart: always
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.production}
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - linkcv-production-logs:/var/log/linkcv:ro
      - linkcv-production-promtail-positions:/tmp
    networks:
      - linkcv-runtime
    depends_on:
      linkcv:
        condition: service_started
      linkcv-worker:
        condition: service_started

  linkcv-worker:
    image: linkcv:${TAG:-latest}
    container_name: linkcv-worker
    command: ["python", "-m", "linkcv.workers"]
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env.production}
      - ${LINKCV_SECRET_ENV_FILE:-../.env.production.local}
    environment:
      APP_ENV: production
      LOG_DIRECTORY: /app/logs/worker
      TZ: Asia/Shanghai
    volumes:
      - linkcv-production-logs:/app/logs
    networks:
      - linkcv-runtime
    labels:
      com.linkcv.environment: production
      com.linkcv.role: resume-import-worker

networks:
  linkcv-runtime:
    external: true
    name: ${LINKCV_DOCKER_NETWORK:-tolink-app-net}

volumes:
  linkcv-production-logs:
    name: linkcv-production-logs
  linkcv-production-promtail-positions:
    name: linkcv-production-promtail-positions
