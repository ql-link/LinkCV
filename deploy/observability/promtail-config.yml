server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_PUSH_URL}

scrape_configs:
  - job_name: linkresume-jsonl
    static_configs:
      - targets:
          - localhost
        labels:
          job: linkresume-jsonl
          __path__: /var/log/linkresume/**/linkresume*.jsonl
    pipeline_stages:
      - json:
          expressions:
            service: service
            environment: environment
            log_type: log_type
            level: level
            log_timestamp: timestamp
      - timestamp:
          source: log_timestamp
          format: RFC3339Nano
          action_on_failure: skip
      - labels:
          service:
          environment:
          log_type:
          level:
