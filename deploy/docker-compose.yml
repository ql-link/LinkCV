# 部署用 compose：引用本机 docker build 出来的镜像并启动。
# 用法：
#   TAG=xxx docker compose -f deploy/docker-compose.yml up -d

services:
  linkcv:
    image: linkcv:${TAG:-latest}
    container_name: linkcv
    restart: always
    env_file:
      - ${LINKCV_ENV_FILE:-../.env}
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      API_PORT: 4174
      DATA_DIR: /app/data
    ports:
      - "4174:4174"
    volumes:
      - /opt/tolink/LinkCV/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4174/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
